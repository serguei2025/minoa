<style>
:root{--bg:#2c3748;--card:#fff;--ink:#121a26;--ink2:#c3cedb;--muted:#8d9bb0;--line:#3e4c62;--acc:#d1925f;--acc-2:#b5774a;--acc-soft:#3a4960;--lime:#d1925f;--dot:#5fb3a8;--ok:#5fb3a8;--ok-soft:#1f3333;--warn:#e2b26b;--warn-soft:#352c1f;--bad:#ef8a7a;--bad-soft:#3a2426;--r:20px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.045);--nav:rgba(42,52,70,.9);--btnInk:#fff;color-scheme:dark}
html.car{--bg:#2c3748;--card:#333f53;--ink:#eef3f8;--ink2:#c3cedb;--muted:#8d9bb0;--line:#3e4c62;--acc:#d1925f;--acc-2:#b5774a;--acc-soft:#39465b;--ok:#8fc7a0;--ok-soft:#1f2c27;--warn:#e2b26b;--warn-soft:#352c1f;--bad:#ef8a7a;--bad-soft:#3a2426;--shadow:none;--nav:rgba(42,52,70,.96);--btnInk:#121a26;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.i{display:block;flex:none}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
h1{font-family:Manrope,-apple-system,sans-serif;font-size:25px;margin:0;letter-spacing:-.025em;line-height:1.15;font-weight:800}
h1 .pt{color:var(--dot)}html.car h1 .pt{color:#d1925f}
.sub{color:var(--muted);font-size:13px}
.back{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:13px;font-weight:600;background:none;border:0;padding:4px 0;cursor:pointer;min-height:32px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
main{padding:2px 18px 24px;max-width:560px;margin:0 auto}
.blk{margin-bottom:22px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sh h2{font-family:Manrope,-apple-system,sans-serif;font-size:17px;font-weight:700;margin:0;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.cnt{font-family:-apple-system,sans-serif;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--lime);color:#121a26;display:inline-grid;place-items:center}
.more{display:flex;align-items:center;gap:2px;color:var(--acc);font-size:13px;font-weight:600;background:none;border:0;cursor:pointer;min-height:36px;padding:0}
.card{background:var(--card);border-radius:var(--r);padding:4px 16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
.card.pad{padding:16px}
.btn{min-height:48px;border:0;border-radius:14px;padding:10px 16px;font-weight:600;font-size:15px;background:var(--acc);color:var(--btnInk);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--acc-soft);color:var(--acc)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%;margin-top:10px}
.link{color:var(--acc);font-size:14px;font-weight:600;background:none;border:0;padding:6px 2px;cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(94px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;padding:0;box-shadow:0 8px 22px rgba(35,42,52,.28);z-index:6}
html.car .fab{box-shadow:0 8px 24px rgba(209,146,95,.25)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:8}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;justify-content:center;cursor:pointer;font-weight:500}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button .i{padding:4px 12px;box-sizing:content-box;border-radius:12px;transition:background .2s}
nav.tabs button.on .i{background:var(--lime);color:#121a26}
html.car nav.tabs button.on .i{background:#d1925f;color:#121a26}

.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(40,50,68,.95) 0%,rgba(41,54,74,.82) 52%,rgba(44,58,82,.25) 100%)}
.hero>*{position:relative;z-index:1}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hring{width:62px;height:62px;flex:none;position:relative}.hring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;font-family:Manrope,sans-serif}
.hero-k{font-size:12px;opacity:.72;text-transform:capitalize}
.hero-t{font-family:Manrope,-apple-system,sans-serif;font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em;line-height:1.15}
.hero-s{font-size:13px;opacity:.8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:#121a26;border:0;border-radius:999px;padding:0 16px;min-height:40px;font-weight:650;font-size:14px;cursor:pointer;position:relative;z-index:1}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.qa button{background:var(--card);border:0;border-radius:18px;box-shadow:var(--shadow);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer;min-height:78px;font-weight:500}
.qa span{width:36px;height:36px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:11px;font-size:13.5px;color:var(--muted);min-height:40px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--acc);color:var(--btnInk);font-weight:650}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:0 15px;font-size:13.5px;min-height:38px;cursor:pointer;font-weight:500}
.chip.on{background:var(--acc);color:var(--btnInk);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-weight:600;font-size:15px;overflow-wrap:anywhere;color:var(--ink)}
.m{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.desc{color:var(--muted);font-size:13.5px;margin-top:3px;overflow-wrap:anywhere;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ib{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:1.6px solid #56657c;background:none;display:grid;place-items:center;color:transparent;cursor:pointer;padding:0}
.check.on{background:var(--acc);border-color:var(--acc);color:#fff}
.done .t{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink2);font-weight:600;letter-spacing:.01em}
.tag.acc{background:var(--acc-soft);color:var(--acc)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.amt{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}.pos{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);min-width:0}
.stat .l{font-size:11.5px;color:var(--muted)}.stat .v{font-size:16px;font-weight:650;margin-top:3px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0}
.mini3 .l{font-size:11.5px;color:var(--muted)}.mini3 b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.spaces{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.spaces button{background:var(--card);border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);cursor:pointer;min-height:74px}
.spaces span{color:var(--acc)}
.empty{color:var(--muted);text-align:center;padding:20px 8px 16px;font-size:13.5px}
.empty .eic{width:46px;height:46px;border-radius:15px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin:0 auto 10px}
.mk{display:inline-flex;align-items:center;gap:7px;font-family:Manrope,-apple-system,sans-serif;font-weight:800;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.mk i{width:24px;height:24px;border-radius:8px;background:#2e394b;color:var(--lime);display:grid;place-items:center;font-style:normal;font-size:13px}
.foot{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12px;margin:4px 4px 0}
.foot .i{margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.pf .img{aspect-ratio:4/3;background:linear-gradient(135deg,#364357,#3a485f);display:grid;place-items:center;color:#6f8099}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf .b{padding:10px 12px 12px}.pf .t{font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;padding-bottom:12px}
.cal .h{font-size:11.5px;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border:0;background:none;border-radius:12px;font-size:14px;color:var(--ink);position:relative;cursor:pointer;min-height:38px;padding:0}
.cal button.today{background:var(--acc-soft);color:var(--acc);font-weight:700}
.cal button.sel{background:var(--acc);color:#fff}
.cal button.dot::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--warn)}
.cal button.sel.dot::after{background:var(--lime)}
.cal button.out{visibility:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.nav b{text-transform:capitalize;font-weight:650;font-size:15px}
.card .nav{padding-top:10px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.day{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.meal{display:flex;gap:8px;align-items:center;padding:7px 0}
.meal .k{width:38px;font-size:12px;color:var(--muted);flex:none}
.slot{flex:1;min-width:0;text-align:left;border:1px dashed #d7d5cc;background:none;border-radius:12px;padding:9px 12px;color:var(--muted);font-size:14px;min-height:44px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.f{border:1px solid transparent;color:var(--ink);background:var(--bg);font-weight:600}
.mini{border:0;background:var(--acc-soft);color:var(--acc);border-radius:12px;padding:0 12px;font-size:13px;font-weight:600;min-height:44px;min-width:44px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.inline{display:flex;gap:8px;margin-bottom:6px}
.inline .btn{width:52px;padding:0;flex:none}
.searchf{position:relative;margin-bottom:12px}.searchf .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.searchf input{padding-left:42px;background:var(--card);border-color:var(--line)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 13px;min-height:48px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.sheet-bg{position:fixed;inset:0;background:rgba(38,46,62,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:10px}
.actions{display:flex;gap:10px;margin-top:6px}.actions .btn{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.sw{width:50px;height:30px;border-radius:15px;background:#42526a;border:0;position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(35,42,52,.2)}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:40;animation:fade .2s;white-space:nowrap}
.datebox{width:44px;height:48px;border-radius:12px;background:var(--bg);text-align:center;flex:none;display:flex;flex-direction:column;justify-content:center}.datebox b{display:block;font-size:17px;line-height:1.1}.datebox span{font-size:11px;color:var(--muted);text-transform:uppercase}
.info p{margin:12px 0;font-size:14px;color:var(--ink2)}
/* ===== Voiture (ambiance premium) ===== */
.carhero{position:relative;border-radius:26px;padding:18px 14px 16px;background:radial-gradient(120% 90% at 50% 0%,#2c4566 0%,#1b150f 58%,#2d3a4e 100%);border:1px solid #3e4c62;overflow:hidden;margin-bottom:14px}
.ck{text-align:center;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#d1925f}
.ckn{text-align:center;font-size:12px;color:#8d9bb0;margin-top:3px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.gauge{position:relative;display:grid;place-items:center}
.gauge svg{width:132px;height:132px}
.gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:6px}
.gauge .c b{font-size:19px;font-weight:600;color:#eef3f8;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gauge .c span{font-size:11px;color:#8d9bb0;max-width:96px;line-height:1.3}
.carimg{display:block;width:92%;height:auto;margin:6px auto 0;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(209,146,95,.12))}
.gasbtn{width:100%;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#d1925f,#b5774a);color:#121a26;border:0;border-radius:18px;padding:14px 16px;min-height:60px;cursor:pointer;margin-bottom:18px;text-align:left}
.gasbtn b{display:block;font-size:15.5px}.gasbtn span{font-size:12.5px;opacity:.75}
.gasbtn .i:last-child{margin-left:auto}
.ctl{background:#333f53;border:1px solid #3e4c62;border-radius:18px;padding:14px;margin-bottom:12px}
.ctl .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8d9bb0;margin-bottom:10px;display:flex;justify-content:space-between}
.ctl .lbl b{color:#eef3f8;letter-spacing:0;text-transform:none;font-size:13px}
.fuels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fuels button{min-height:42px;border-radius:12px;border:1px solid #3e4c62;background:#2c3748;color:#c3cedb;font-size:13.5px;font-weight:600;cursor:pointer}
.fuels button.on{background:#d1925f;border-color:#d1925f;color:#121a26}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;border:0;padding:0;min-height:28px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#d1925f var(--p,30%),#3e4c62 var(--p,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#eef3f8;border:3px solid #d1925f;margin-top:-10px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3e4c62}input[type=range]::-moz-range-progress{height:4px;background:#d1925f}input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#eef3f8;border:3px solid #d1925f}
.locrow{display:flex;gap:8px}.locrow input{background:#2c3748}.locrow .btn{flex:none;padding:0 14px}
.or{display:flex;align-items:center;gap:10px;color:#8d9bb0;font-size:12px;margin:12px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:#3e4c62}
.here{display:flex;align-items:center;gap:10px}.here .grow b{display:block;font-size:14.5px;color:#eef3f8}.here .grow span{font-size:12px;color:#8d9bb0}
.resbar{display:flex;align-items:center;gap:8px;margin:4px 2px 10px;color:#8d9bb0;font-size:12px}
.resbar .grow{min-width:0}
.st{background:#333f53;border:1px solid #3e4c62;border-radius:18px;padding:14px;margin-bottom:10px}
.st.best{border-color:#d1925f;background:linear-gradient(180deg,#384860,#333f53)}
.st .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.st .pr{font-size:24px;font-weight:600;color:#eef3f8;font-variant-numeric:tabular-nums;line-height:1.1}.st .pr small{font-size:12px;color:#8d9bb0;font-weight:500}
.st .best .pr,.st.best .pr{color:#e9b98f}
.st .dist{text-align:right;flex:none}.st .dist b{display:block;font-size:17px;color:#eef3f8;font-weight:600}.st .dist span{font-size:11px;color:#8d9bb0}
.st .nm{font-weight:600;color:#eef3f8;margin-top:10px;font-size:14.5px;overflow-wrap:anywhere}
.st .ad{font-size:12.5px;color:#8d9bb0;margin-top:2px;overflow-wrap:anywhere}
.st .m{margin-top:8px}
.st .gap{font-size:12.5px;color:#c3cedb;margin-top:8px}
.st .go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.st .go a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;border:1px solid #42526a;color:#e9b98f;text-decoration:none;font-size:13.5px;font-weight:600}
.alert{border-radius:16px;padding:14px;font-size:13.5px;line-height:1.5;margin-bottom:12px;background:#39465b;color:#c3cedb;border:1px solid #42526a}
.alert b{color:#eef3f8}.alert.err{background:#3a2426;border-color:#5a3236}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #42526a;border-top-color:#d1925f;animation:rot .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.odo{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:4px}
.odo span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8d9bb0}
.odo b{font-size:26px;font-weight:300;letter-spacing:.04em;color:#eef3f8;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tile{background:linear-gradient(180deg,#364357,#333f53);border:1px solid #3e4c62;border-radius:18px;padding:14px;min-width:0;position:relative;cursor:pointer}
.tile .i{position:absolute;right:12px;top:12px;color:#d1925f;opacity:.85}
.tile .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8d9bb0;padding-right:22px}
.tile .v{font-size:18px;font-weight:600;color:#eef3f8;margin-top:8px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .s{font-size:12px;color:#8d9bb0;margin-top:3px;overflow-wrap:anywhere}
html.car .card{background:#333f53;border:1px solid #3e4c62}
html.car .ib{background:#39465b;color:#d1925f}
html.car .seg{background:#333f53;border-color:#3e4c62}
html.car .round,html.car .iconbtn{background:#333f53;border-color:#3e4c62;color:#eef3f8}
html.car .tag{background:#39465b;color:#c3cedb}
html.car .tag.ok{background:var(--ok-soft);color:var(--ok)}html.car .tag.warn{background:var(--warn-soft);color:var(--warn)}html.car .tag.bad{background:var(--bad-soft);color:var(--bad)}
html.car .sheet{background:#333f53}
html.car .back{color:#d1925f}

.splash::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,8,.82) 0%,rgba(10,10,8,.45) 30%,rgba(10,10,8,.05) 52%,rgba(10,10,8,.55) 72%,rgba(10,10,8,.96) 92%)}
.splash>*{position:relative}
.sp-top{display:flex;align-items:center;justify-content:space-between}
.sp-mark{display:flex;align-items:center;gap:9px;font-family:Manrope,-apple-system,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.01em}
.sp-mark i{width:32px;height:32px;border-radius:10px;background:#d1925f;color:#121a26;display:grid;place-items:center;font-style:normal;font-size:17px}
.sp-tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.sp-title{font-family:Manrope,-apple-system,sans-serif;font-weight:800;font-size:clamp(40px,12.5vw,54px);line-height:.98;letter-spacing:-.035em;text-transform:uppercase;margin:9vh 0 0}
.sp-title span{color:#d1925f}
.sp-sub{font-size:16px;line-height:1.45;color:rgba(255,255,255,.8);text-shadow:0 1px 12px rgba(0,0,0,.6);margin:14px 0 0;max-width:260px}
.sp-fill{flex:1}
.sp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.sp-chips span{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(255,255,255,.85)}
.start{display:flex;align-items:center;width:100%;height:68px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:6px;cursor:pointer;font:700 15px/1 Manrope,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.start{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.start::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:var(--fill,56px);border-radius:999px;background:linear-gradient(90deg,rgba(209,146,95,.05),rgba(209,146,95,.28))}
.start .go{position:relative;z-index:1;touch-action:none;cursor:grab;will-change:transform;width:56px;height:56px;border-radius:50%;background:#d1925f;color:#121a26;display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px rgba(209,146,95,.12)}
.start span{flex:1;text-align:center;margin-right:56px;position:relative;transition:opacity .15s}
.chev{position:absolute;right:22px;top:50%;transform:translateY(-52%);font-style:normal;font-size:20px;letter-spacing:-2px;color:#d1925f;animation:chev 1.6s ease-in-out infinite;transition:opacity .15s}
@keyframes chev{0%,100%{opacity:.25;transform:translate(0,-52%)}50%{opacity:.9;transform:translate(4px,-52%)}}
.sp-note{text-align:center;font-size:11.5px;color:rgba(255,255,255,.45);margin-top:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}

/* ===== Minoa v3 : identité renforcée ===== */
:root{--bg:#2c3748;--card:#333f53;--line:#3e4c62;--muted:#8d9bb0;--ink2:#c3cedb;--acc-soft:#3a4960}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
main.wb{padding-top:0;position:relative;z-index:1}
.band{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#354864 0%,#3d4d66 55%,#2a364a 100%);color:#eef3f8;padding:calc(14px + env(safe-area-inset-top)) 20px 38px;border-radius:0 0 30px 30px}
.band::before{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(209,146,95,.22);box-shadow:0 0 0 28px rgba(209,146,95,.035),0 0 0 56px rgba(209,146,95,.025);pointer-events:none}
.band::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px) 0 0/16px 16px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 55%);mask-image:linear-gradient(200deg,#000,transparent 55%);pointer-events:none}
.band-in{position:relative;z-index:1;max-width:524px;margin:0 auto}
.band-top{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:10px}
.band-k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#d1925f;font-weight:700}
.bback{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#dbe4ee;border-radius:999px;padding:0 12px 0 8px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer}
.band-t{font-family:Manrope,-apple-system,sans-serif;font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.08;color:#eef3f8;margin:8px 0 0}
.band-t .pt,.hb-t .pt{color:#d1925f}
.band-s{font-size:14px;color:rgba(238,243,248,.7);margin-top:4px}
.bstats{display:flex;gap:8px;margin-top:16px}
.bs{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:10px 12px}
.bs b{display:block;font-family:Manrope,-apple-system,sans-serif;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bs span{font-size:11.5px;color:rgba(238,243,248,.62)}
.bs.warnc b{color:#f3b26b}
.wb>*:first-child{margin-top:-20px;position:relative}
.seg{background:#364357;border:0;padding:4px;border-radius:16px;box-shadow:0 8px 18px -12px rgba(35,42,52,.45)}
.seg button{color:#9aa8bc}
.seg button.on{background:#3d4d66;color:#d1925f;box-shadow:none}
html.car .seg{box-shadow:none}html.car .seg button{color:var(--muted)}html.car .seg button.on{background:var(--acc);color:var(--btnInk)}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:36px}
.chip{background:var(--card);border-color:var(--line)}
.chip.on{background:#3d4d66;border-color:#3d4d66;color:#d1925f}
html.car .chip.on{background:var(--acc);color:var(--btnInk);border-color:var(--acc)}
.sh{margin:24px 2px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.fab{background:#3d4d66;color:#d1925f}
html.car .fab{background:var(--acc);color:var(--btnInk)}
/* tâches */
.tk{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 10px 12px 16px;box-shadow:0 1px 0 rgba(35,42,52,.04),0 4px 14px -8px rgba(35,42,52,.2);cursor:pointer;overflow:hidden}
.tk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:#4b5a70}
.tk.pr-haute::before{background:#e0735f}.tk.pr-moyenne::before{background:#e2b26b}.tk.pr-basse::before{background:#5fb3a8}
.dt{display:inline-flex;align-items:center;gap:4px}.dt.late{color:#ef8a7a;font-weight:600}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:#39465b;color:#c3cedb}
.c-alt{background:#384c65;color:#a9cbf0}.c-cours{background:#3d4d66;color:#d1925f}.c-perso{background:#3a2c2a;color:#f0c3a0}.c-run{background:#3a3222;color:#f0cf8a}.c-due{background:#3d2826;color:#f2a48f}.c-car{background:#39465b;color:#e9b98f}
.pdot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);flex:none;width:50px}
.pdot i{width:8px;height:8px;border-radius:50%;background:#4b5a70}
.pr-haute .pdot i{background:#e0735f}.pr-moyenne .pdot i{background:#e2b26b}.pr-basse .pdot i{background:#5fb3a8}
.tk.done{opacity:.6}
.check{border-color:#56657c;border-radius:50%}
.check.on{background:#3d4d66;border-color:#3d4d66;color:#d1925f}
.grp{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8d9bb0;margin:18px 4px 8px}
.grp i{flex:1;height:1px;background:var(--line)}
.grp em{font-style:normal;background:#364357;color:#c3cedb;border-radius:7px;padding:1px 7px;letter-spacing:0}
.grp.late{color:#ef8a7a}.grp.late em{background:#3d2826;color:#f2a48f}
/* rendez-vous */

/* animations */
button,.tk,.ev,.op,.crow,.pc,.tl,.mic,.sitem,.pf,.feat,.ct,.doc,.je{transition:transform .14s ease,box-shadow .2s ease,background-color .2s}
button:active,.tk:active,.ev:active,.op:active,.crow:active,.pc:active,.tl:active,.mic:active,.sitem:active,.pf:active,.feat:active,.ct:active,.doc:active,.je:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){
 html.anim main{animation:pgIn .42s cubic-bezier(.2,.8,.2,1) both}
 html.anim .band,html.anim .hero.hb{animation:bandIn .5s ease both}
 .bimg,.hero.hb{animation:kb 22s ease-in-out infinite alternate}
 html.anim .band.bimg,html.anim .hero.hb{animation:bandIn .5s ease both,kb 22s ease-in-out .5s infinite alternate}
 .rv{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
 .rv.in{opacity:1;transform:none}
 html.anim .tr i,html.anim .bar i,html.anim .fuelbar i.on,html.anim .bprog .tr i,html.anim .brow2 .tr i{transform-origin:left;animation:growX 1s cubic-bezier(.2,.8,.2,1) .15s both}
 html.anim .tbars i{transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) .15s both}
 html.anim .seg-arc{animation:dash 1.2s cubic-bezier(.2,.8,.2,1) .1s both}
 html.anim .fd{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
 html.anim .list>*,html.anim .grid2c>*,html.anim .tiles2>*,html.anim .days>*,html.anim .sum3>*{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
 html.anim .list>*:nth-child(2),html.anim .grid2c>*:nth-child(2),html.anim .tiles2>*:nth-child(2),html.anim .days>*:nth-child(2),html.anim .sum3>*:nth-child(2){animation-delay:.05s}
 html.anim .list>*:nth-child(3),html.anim .grid2c>*:nth-child(3),html.anim .tiles2>*:nth-child(3),html.anim .days>*:nth-child(3),html.anim .sum3>*:nth-child(3){animation-delay:.1s}
 html.anim .list>*:nth-child(n+4),html.anim .grid2c>*:nth-child(n+4),html.anim .tiles2>*:nth-child(n+4),html.anim .days>*:nth-child(n+4){animation-delay:.15s}
 .check.on .i{animation:tick .3s ease}
}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}}
@keyframes bandIn{from{opacity:.4}}
@keyframes kb{from{background-position:42% 50%}to{background-position:58% 44%}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes dash{from{stroke-dasharray:0 400}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes tick{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* organisation */
.catc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cc{border:1px solid rgba(255,255,255,.06);background:var(--card);border-radius:16px;padding:10px 8px 9px;text-align:left;color:#eef3f8;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.cc .cci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#3a4960;color:#e9b98f;margin-bottom:4px}

.cc.on{background:linear-gradient(135deg,#e9b98f,#d1925f);color:#121a26;border-color:transparent}.cc.on .cci{background:rgba(46,57,75,.15);color:#121a26}.cc.on>span:not(.cci){color:#3a2a1e}.cc.on .ccb{background:rgba(46,57,75,.18)}.cc.on .ccb i{background:#2e394b}
.donel-row{display:flex;justify-content:flex-end;margin:8px 0 2px}
.donel{display:inline-flex;align-items:center;gap:6px;border:1px solid #42526a;background:transparent;color:#c3cedb;border-radius:999px;padding:0 12px;min-height:34px;font-size:12.5px;font-weight:600;cursor:pointer}

.wkc{margin-top:10px}

.wkb span{font-size:11px;font-weight:700;text-transform:uppercase}.wkb.cur span{color:#e9b98f}.wkb.cur .wkt{box-shadow:0 0 0 1.5px #d1925f}
.tl2{position:relative}
.tld{display:flex;gap:12px;position:relative;padding-bottom:12px}
.tld::before{content:"";position:absolute;left:22px;top:46px;bottom:0;width:2px;background:linear-gradient(#42526a,transparent)}
.tld:last-child::before{display:none}
.tldh{width:46px;flex:none;height:50px;border-radius:14px;background:#39465b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eef3f8}
.tldh b{font:800 18px Manrope,sans-serif;line-height:1}.tldh span{font-size:9.5px;text-transform:uppercase;font-weight:700;color:#a3b2c4;margin-top:2px;text-align:center}
.tld.td .tldh{background:linear-gradient(135deg,#e9b98f,#d1925f);color:#121a26}.tld.td .tldh span{color:#3a2a1e}
.tldl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tle{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:10px 12px;cursor:pointer;color:#8d9bb0}

.catl{margin-top:14px;padding-top:6px;border-top:1px solid #3e4c62;display:flex;flex-direction:column}
.catrow{display:flex;align-items:center;gap:10px;padding:7px 0}

.mbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;border-radius:20px;min-height:168px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border:1px solid rgba(255,255,255,.06);text-align:left;color:#fff}

.ch{position:relative;border-radius:28px;overflow:hidden;padding:18px 16px 14px;background:radial-gradient(90% 70% at 50% 58%,#3b5a82 0%,#384b6a 38%,#2f3e56 70%,#2b384c 100%);border:1px solid rgba(255,255,255,.07);box-shadow:0 22px 40px -24px rgba(35,42,52,.95)}

/* ===== v7 : page d'arrivée et accueil façon maquette ===== */
.splash.s7{background:#273142;padding:calc(18px + env(safe-area-inset-top)) 28px calc(26px + env(safe-area-inset-bottom))}
.splash.s7::before{display:none}
.s7bg{position:absolute;inset:-4%;background-size:cover;background-position:center 70%;animation:kb7 26s ease-in-out infinite alternate;will-change:transform}
@keyframes kb7{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.09) translate3d(-1.5%,-1%,0)}}
.s7shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(39,49,66,.92) 0%,rgba(39,49,66,.55) 34%,rgba(39,49,66,.05) 52%,rgba(39,49,66,.15) 72%,rgba(39,49,66,.9) 100%)}
.s7lamp{position:absolute;right:-6%;top:33%;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(233,170,110,.42),rgba(233,170,110,0) 62%);mix-blend-mode:screen;animation:lamp7 5.5s ease-in-out infinite;pointer-events:none}
@keyframes lamp7{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
.s7dots{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.s7dots i{position:absolute;bottom:-20px;width:var(--s,6px);height:var(--s,6px);border-radius:50%;background:radial-gradient(circle,rgba(255,214,170,.9),rgba(255,214,170,0) 70%);left:var(--x);opacity:0;animation:rise7 var(--d,14s) linear infinite;animation-delay:var(--t,0s);filter:blur(.5px)}
@keyframes rise7{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.75}80%{opacity:.45}100%{transform:translate3d(var(--w,20px),-92vh,0);opacity:0}}
.s7sweep{position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);animation:sweep7 9s ease-in-out infinite;pointer-events:none}
@keyframes sweep7{0%,55%{left:-60%}100%{left:130%}}
.splash.s7>*:not(.s7bg):not(.s7shade):not(.s7lamp):not(.s7dots):not(.s7sweep){position:relative;z-index:2}
.mk7{display:inline-flex;align-items:center;gap:10px;color:#eef3f8}
.mk7 svg{width:46px;height:24px;flex:none}
.mk7 b{font:600 25px Manrope,-apple-system,sans-serif;letter-spacing:-.02em}
.s7 .mk7{margin-top:30px}
.s7 h1{font:800 clamp(42px,12.8vw,56px)/1.02 Manrope,-apple-system,sans-serif;letter-spacing:-.03em;text-transform:uppercase;margin:9vh 0 0;color:#f4f6fa}
.s7 h1 span{color:#e3a571;background:linear-gradient(90deg,#f0be8e,#d1925f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.s7 p.s7sub{margin:14px 0 0;font-size:17px;color:rgba(238,243,248,.82);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.s7 .s7line{width:56px;height:2px;border-radius:2px;background:#d1925f;margin-top:18px}
.s7 .start{height:66px;border:0;border-radius:999px;background:linear-gradient(135deg,#f0be8e,#d1925f 60%,#c27f4c);color:#121a26;box-shadow:0 14px 34px -12px rgba(209,146,95,.7),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:none;backdrop-filter:none;font:800 17px/1 Manrope,-apple-system,sans-serif;letter-spacing:.16em}
.s7 .start::before{background:linear-gradient(90deg,rgba(46,57,75,.0),rgba(46,57,75,.16))}
.s7 .start .go{background:rgba(46,57,75,.16);color:#121a26;box-shadow:none;width:54px;height:54px}
.s7 .chev{color:#121a26}
html.anim .s7 h1,html.anim .s7 .start{animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.s7 h1{animation:up7 .9s cubic-bezier(.2,.8,.2,1) .1s both}.s7 .s7sub,.s7 .s7line{animation:up7 .9s cubic-bezier(.2,.8,.2,1) .3s both}.s7 .start{animation:up7 .9s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes up7{from{opacity:0;transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){.s7bg,.s7lamp,.s7dots i,.s7sweep,.aur7 i{animation:none!important}.s7dots{display:none}}
/* fond animé de l'accueil */
.aur7{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#30405a 0%,#2a3548 55%,#293445 100%)}

.aur7 i:nth-child(2){width:60vw;height:60vw;right:-25vw;top:40vh;background:#8a5530;opacity:.32;animation:a72 26s ease-in-out infinite alternate}

function upcoming(from=today){

function planHTML(k){const p=budgetPlan(k),R=S.recur||[],cb=S.catBud||{},cats=DCATS.filter(c=>+cb[c]>0);let h='';
 const alerts=cats.map(c=>[c,catSpent(k,c),+cb[c]]).filter(([c,sp,l])=>sp/l>=.8);
 if(alerts.length)h+=`<div class="bal7">${alerts.map(([c,sp,l])=>`<div class="${sp>l?'over':''}">${ic('info',15)}<span>${sp>l?`<b>${c}</b> : budget dépassé de ${eur(sp-l)}`:`<b>${c}</b> : ${Math.round(sp/l*100)} % du budget utilisé`}</span></div>`).join('')}</div>`;
 /* Reste à vivre */
 if(R.length||p.inc){const mo=mLabel(k).split(' ')[0];
  h+=`<section class="rav"><div class="rav-h"><span class="rav-k">Reste à vivre · ${mo}</span><b class="${p.reste<0?'neg':''}">${eur(p.reste)}</b><small>Revenus ${eur(p.inc)} − charges fixes ${eur(p.fixed)}</small></div>
  <div class="rav-g"><div><span>Dépensé hors charges fixes</span><b>${eur(p.variable)}</b></div><div><span>${p.isCur||k>ym?'Encore disponible':'Restant en fin de mois'}</span><b class="${p.dispo<0?'neg':'pos'}">${eur(p.dispo)}</b></div></div>
  ${p.reste>0?`<div class="bbar rav-tr"><i style="width:${Math.min(100,Math.max(0,p.variable/p.reste*100))}%" class="${p.dispo<0?'over':''}"></i></div>`:''}
  ${p.isCur?`<div class="rav-f"><div class="rav-d"><span>${ic('cal',15)}Par jour jusqu’à la fin du mois</span><b class="${p.perDay<0?'neg':''}">${p.perDay<0?'0,00 €':eur(p.perDay)}</b><small>${p.left} jour${p.left>1?'s':''} restant${p.left>1?'s':''}</small></div>
   <div class="rav-d"><span>${ic('up',15)}Prévision au ${p.L} ${mo}</span>${p.el>=5||!p.variable?`<b class="${p.proj<0?'neg':'pos'}">${p.proj>0?'+':''}${eur(p.proj)}</b><small>${p.variable?`si tu gardes ton rythme de ${eur(p.variable/p.el)} / jour`:'aucune dépense courante notée pour l’instant'}</small>`:`<b>—</b><small>disponible à partir du 5, quand ton rythme de dépenses sera connu</small>`}</div></div>`:''}
  ${!R.length?`<button class="rav-cta" data-a="add:recur">${ic('plus',15)}Ajoute tes charges fixes pour un reste à vivre exact</button>`:''}</section>`}
 /* Charges fixes */
 const out=R.filter(r=>r.kind==='Dépense'),inc=R.filter(r=>r.kind!=='Dépense'),tot=a=>a.filter(r=>!r.paused).reduce((s,r)=>s+(+r.amount||0),0);
 h+=sec('Charges fixes',R.length?'add:recur':'','Ajouter',R.length);
 h+=R.length?`<section class="chart rec7">${[[inc,'Revenus réguliers','pos'],[out,'Charges fixes','']].filter(([a])=>a.length).map(([a,l,c])=>`<div class="rec-h"><span>${l}</span><b class="${c}">${c?'+':'−'}${eur(tot(a))} / mois</b></div>${a.sort((x,y)=>(+x.day||1)-(+y.day||1)).map(r=>{const dn=(r.done||[]).includes(k);return `<div class="rec-r ${r.paused?'off':''}" data-a="edit:recur:${r.id}"><span class="rec-d"><small>le</small>${Math.round(+r.day)||1}</span><div class="grow"><div class="t">${esc(r.label)}</div><div class="m">${esc(r.cat||'')}${r.paused?' · en pause':k<=ym&&(r.start||ym)<=k?dn?' · ajouté ce mois-ci':' · à venir ce mois-ci':''}</div></div><b class="${r.kind==='Revenu'?'pos':''}">${r.kind==='Revenu'?'+':'−'}${eur(r.amount)}</b></div>`}).join('')}`).join('')}<p class="rec-n">${ic('info',13)}Ajoutées automatiquement aux opérations le jour prévu.</p></section>`
  :`<button class="rec-empty" data-a="add:recur"><span class="sci">${ic('home',18)}</span><div class="grow"><b>Ajouter mes charges fixes</b><span>Loyer, téléphone, assurance, abonnements, salaire… Saisis-les une fois, Minoa les ajoute chaque mois.</span></div>${ic('plus',18)}</button>`;
 /* Budgets par catégorie */
 h+=sec('Budgets par catégorie',cats.length?'catbud':'','Modifier',cats.length);
 h+=cats.length?`<section class="chart bcat">${cats.map(c=>{const sp=catSpent(k,c),l=+cb[c],pc=sp/l*100,st=pc>100?'over':pc>=80?'warn':'';return `<div class="cb-r" data-a="catbud"><div class="crt"><span>${c}</span><b>${eur(sp)} <small>/ ${eur(l)}</small></b></div><div class="bbar"><i class="${st}" style="width:${Math.min(100,pc)}%"></i></div><small class="cb-s ${st}">${pc>100?`Dépassé de ${eur(sp-l)}`:`Reste ${eur(l-sp)} · ${Math.round(pc)} %`}</small></div>`}).join('')}</section>`
  :`<button class="rec-empty" data-a="catbud"><span class="sci">${ic('wallet',18)}</span><div class="grow"><b>Fixer mes budgets</b><span>Par exemple 200 € de courses et 80 € de loisirs par mois. Tu seras prévenu à 80 % et en cas de dépassement.</span></div>${ic('plus',18)}</button>`;
 return h}
function catBudSheet(){const cb=S.catBud||{};sheet(`<h3>Budgets par catégorie${closeBtn}</h3><p class="sub" style="margin:-4px 0 14px">Montant maximum par mois. Laisse vide pour ne pas suivre une catégorie.</p><form data-catbud="1">${DCATS.map(c=>`<label class="f cbf"><span>${c}</span><input name="${c}" type="text" inputmode="decimal" placeholder="—" value="${+cb[c]>0?String(cb[c]).replace('.',','):''}"></label>`).join('')}<div class="actions"><button class="btn">Enregistrer</button></div></form>`)}
const lastDay=k=>new Date(+k.slice(0,4),+k.slice(5),0).getDate();
const rDate=(r,k)=>`${k}-${pad(Math.min(Math.max(1,Math.round(+r.day)||1),lastDay(k)))}`;
function genRecur(){let ch=0;(S.recur||[]).forEach(r=>{if(r.paused)return;r.done=r.done||[];let k=r.start||ym,g=0;
  while(k<=ym&&g++<36){if(!r.done.includes(k)){const d=rDate(r,k);if(d<=today){S.money.push({id:uid(),kind:r.kind,label:r.label,amount:+r.amount||0,date:d,cat:r.cat,rid:r.id});r.done.push(k);ch++}}k=shiftM(k,1)}});
 if(ch&&typeof P_!=='undefined'&&P_.ready)scheduleSave();return ch}
function budgetPlan(k){const t=monthTotals(k),R=(S.recur||[]).filter(r=>!r.paused&&(r.start||ym)<=k),pend=R.filter(r=>!(r.done||[]).includes(k));
 const genOut=t.l.filter(x=>x.rid&&x.kind==='Dépense').reduce((s,x)=>s+(+x.amount||0),0);
 const pOut=pend.filter(r=>r.kind==='Dépense').reduce((s,r)=>s+(+r.amount||0),0),pInc=pend.filter(r=>r.kind==='Revenu').reduce((s,r)=>s+(+r.amount||0),0);
 const inc=t.inc+pInc,fixed=genOut+pOut,variable=t.out-genOut,reste=inc-fixed,dispo=reste-variable,L=lastDay(k),isCur=k===ym,el=isCur?new Date().getDate():L,left=isCur?L-el+1:0;
 return {t,R,pend,inc,fixed,variable,reste,dispo,L,isCur,el,left,perDay:left?dispo/left:null,proj:isCur?reste-variable/el*L:null}}
function catSpent(k,c){return S.money.filter(x=>x.kind==='Dépense'&&x.cat===c&&x.date&&x.date.startsWith(k)).reduce((s,x)=>s+(+x.amount||0),0)}
function catAlert(c,k){const lim=+(S.catBud||{})[c]||0;if(!lim)return '';const sp=catSpent(k,c),p=sp/lim*100;
 return p>100?`Budget ${c} dépassé de ${eur(sp-lim)}`:p>=80?`Attention : ${Math.round(p)} % du budget ${c} utilisé`:''}
function monthTotals(k){const l=S.money.filter(x=>x.date&&x.date.startsWith(k));
 const inc=l.filter(x=>x.kind==='Revenu').reduce((s,x)=>s+(+x.amount||0),0),out=l.filter(x=>x.kind==='Dépense').reduce((s,x)=>s+(+x.amount||0),0);
 return {l,inc,out,bal:inc-out}}

(()=>{const st=document.createElement('style');st.textContent=Object.entries(IMG).map(([k,v])=>Array.isArray(v)?v.map((u,j)=>`.im-${k}${j}{background-image:url(${u})}`).join(''):`.im-${k}{background-image:url(${v})}`).join('');document.head.appendChild(st)})();
const hi=s=>{let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%6};
const EIMG={check:'agenda',cal:'agenda',wallet:'budget',cart:'meals',bowl:'meals',bulb:'studio',image:'studio',book:'journal',search:'journal',spark:'home',star:'studio'};
function ring(f,val,label){const r=50,C=2*Math.PI*r,L=C*.75,v=Math.max(0,Math.min(1,f||0));
 return `<div class="gauge"><svg viewBox="0 0 132 132"><defs><linearGradient id="rg${label.length}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c8794"/><stop offset="1" stop-color="#e9b98f"/></linearGradient></defs><g transform="rotate(135 66 66)"><circle cx="66" cy="66" r="${r}" fill="none" stroke="#3e4c62" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L} ${C}"/>${v>0?`<circle cx="66" cy="66" r="${r}" fill="none" stroke="url(#rg${label.length})" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L*v} ${C}"/>`:''}</g></svg><div class="c"><b>${val}</b><span>${label}</span></div></div>`}

/* ===== Vues ===== */
P.sun='<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>';
P.moon='<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>';
const CATC={Alternance:'c-alt',Cours:'c-cours',Perso:'c-perso'};
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z]+/g,'-').toLowerCase().replace(/^-|-$/g,'');
const eurS=n=>`${Math.round(+n||0).toLocaleString('fr-FR')} €`;
const ill=(i,s=54)=>`<svg class="ill" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><rect x="5" y="15" width="42" height="42" rx="13" fill="#3a4960"/><rect x="15" y="6" width="42" height="42" rx="13" fill="#3d4d66"/><circle cx="55" cy="9" r="5" fill="#d1925f"/><circle cx="8" cy="54" r="2.5" fill="#5fb3a8"/><g transform="translate(24 15)" fill="none" stroke="#d1925f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[i]||P.spark}</g></svg>`;
const emp=(t,a,l,i='spark')=>`<div class="emp"><div class="emp-img im-${EIMG[i]||'home'}"><b>${ic(i,14)}</b></div><div class="grow"><div class="emp-t">${t}</div>${a?`<button class="emp-b" data-a="${a}">${ic('plus',14)}${l}</button>`:''}</div></div>`;
const band=o=>`<section class="band ${o.img?`bimg im-${o.img}`:''}"><div class="band-in"><div class="band-top">${o.back?`<button class="bback" data-a="${o.back}">${ic('left',14)}${o.backL||'Plus'}</button>`:`<div class="band-k">${o.k||''}</div>`}${o.right||''}</div><h1 class="band-t">${o.t}<span class="pt">.</span></h1>${o.s?`<div class="band-s">${o.s}</div>`:''}${o.x||''}</div></section>`;
const bstats=a=>`<div class="bstats">${a.map(([v,l,c])=>`<div class="bs ${c||''}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const sec=(t,a,lbl,n)=>`<div class="sh"><h2>${t}${n?`<span class="cnt">${n}</span>`:''}</h2>${a?`<button class="more" data-a="${a}">${lbl||'Voir tout'}${ic('right',14)}</button>`:''}</div>`;
function taskRow(t){const done=t.status==='Terminé',late=!done&&t.date&&t.date<today,pr=slug(t.priority||'Moyenne');
 return `<div class="tk pr-${pr} ${done?'done':''}" data-a="edit:tasks:${t.id}"><button class="check ${done?'on':''}" data-a="tt:${t.id}" aria-label="${done?'Remettre à faire':'Marquer comme terminée'}">${ic('tick',16)}</button><div class="grow"><div class="t">${esc(t.title)}</div><div class="m">${t.date?`<span class="dt ${late?'late':''}">${ic('cal',12)}${late?'En retard · ':''}${t.date===today?'Aujourd’hui':fmtD(t.date)}</span>`:''}<span class="cat ${CATC[t.cat]||''}">${t.cat}</span>${t.status==='En cours'?'<span class="cat c-run">En cours</span>':''}</div></div><span class="pdot"><i></i>${t.priority}</span></div>`}
function evRow(e){const d=toD(e.date);
 return `<div class="ev" data-a="edit:${e.coll}:${e.id}"><div class="evd ${e.date===today?'today':''}"><b>${d.getDate()}</b><span>${d.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</span></div><div class="grow"><div class="t">${esc(e.title)}</div><div class="m">${e.time?`<span>${ic('clock',12)}${e.time}</span>`:''}<span class="cat ${e.kind==='Échéance'?'c-due':e.kind==='Voiture'?'c-car':'c-alt'}">${e.kind}</span><span>${rel(e.date)}</span></div></div>${ic('right',16)}</div>`}
const CATV={'Site web':['grid','v1',2],'Design':['pen','v2',1],'Logo':['star','v3',0],'Appli':['spark','v4',4],'Autre':['bulb','v5',5]};
const ideaCard=i=>{const v=CATV[i.cat]||CATV.Autre;return `<div class="pc" data-a="edit:ideas:${i.id}"><div class="pc-v im-tex${v[2]}">${ic(v[0],34)}<span class="stt st-${slug(i.status)}">${i.status}</span></div><div class="pc-b"><div class="pc-k">${i.cat}</div><div class="t">${esc(i.title)}</div>${i.desc?`<div class="desc">${esc(i.desc)}</div>`:''}</div></div>`};
const PAL=['#d1925f','#6f9bd1','#5fb3a8','#e2b26b','#d97a6c','#a48fd6','#e9b98f','#4f7fb8','#8fc7a0','#c3cedb','#b5774a'];
function donut(entries,total){const r=42,C=2*Math.PI*r;let off=0;

 try{const r=await fetchT(API+'?'+new URLSearchParams({where,limit:'100'}));if(!r.ok)throw new Error('réponse du serveur '+r.status);const j=await r.json();
  (j.results||[]).forEach(x=>{const s=norm(x,true),fv=favs.find(f=>f.id===s.id);if(fv)Object.assign(fv,snap(s))});G.favStatus='';scheduleSave();toast('Prix des favoris mis à jour')}
 catch(e){G.favStatus='error';G.favErr=e.name==='AbortError'?'délai dépassé':'connexion refusée ou bloquée'}
 render()}
function gasSorted(){const R=[...G.results];if(!R.length)return R;const minP=Math.min(...R.map(x=>x.price));
 const near=R.filter(x=>x.dist!=null).sort((a,b)=>a.dist-b.dist)[0],top=[...new Set(R.map(x=>x.price))].sort((a,b)=>a-b).slice(0,3);
 R.forEach(x=>{x.best=x.price===minP;x.top=top.includes(x.price);x.diff=x.price-minP;x.isNear=x===near;x.vsNear=near&&x!==near?(near.price-x.price)*40:null});
 return R.sort(G.sort==='dist'?(a,b)=>(a.dist??1e9)-(b.dist??1e9):(a,b)=>a.price-b.price||(a.dist??1e9)-(b.dist??1e9))}
function age(m){const d=m?new Date(m):null;if(!d||isNaN(d))return '<span class="tag warn">Date de mise à jour inconnue</span>';
 const h=(Date.now()-d)/36e5,txt=h<1?`il y a ${Math.max(1,Math.round(h*60))} min`:h<24?`il y a ${Math.round(h)} h`:`il y a ${Math.round(h/24)} j`;
 return h>72?`<span class="tag bad">Prix ancien · ${txt}</span>`:h>24?`<span class="tag warn">Prix mis à jour ${txt}</span>`:`<span>Prix mis à jour ${txt}</span>`}
const pf=p=>p.toFixed(3).replace('.',',');
const old=m=>{const d=m?new Date(m):null;return !d||isNaN(d)||(Date.now()-d)/36e5>72};
function stRow(s,isFavList){const cv=[s.cp,s.ville].filter(Boolean).join(' '),dest=s.lat!=null?`${s.lat},${s.lon}`:encodeURIComponent([s.adresse,cv].filter(Boolean).join(', '));
 const isFav=(S.gasFav||[]).some(x=>x.id===s.id);
 const g=[];if(!isFavList){if(!s.best)g.push(`+${pf(s.diff)} € /L par rapport au meilleur prix`);
 if(s.isNear)g.push('Station la plus proche');
 else if(s.vsNear!=null&&Math.abs(s.vsNear)>=0.01)g.push(s.vsNear>0?`${eur(s.vsNear)} d’économie sur 40 L par rapport à la plus proche`:`${eur(-s.vsNear)} de plus sur 40 L que la plus proche`)}

 return `<div class="st ${s.best?'best':''} ${isFavList?'favst':''}"><div class="top"><div>${s.price?`<div class="pr">${pf(s.price)} <small>€/L · ${fl}</small></div>`:`<div class="pr" style="font-size:15px;color:#a3b2c4">${fl} : prix non déclaré</div>`}${s.best?'<span class="tag warn" style="margin-top:6px">Meilleur prix</span>':s.top?'<span class="tag" style="margin-top:6px">Parmi les moins chers</span>':''}${s.rupture?'<span class="tag bad" style="margin-top:6px">Rupture signalée</span>':''}</div><div style="display:flex;gap:8px;align-items:flex-start"><div class="dist"><b>${s.dist!=null?(s.dist<10?s.dist.toFixed(1).replace('.',','):Math.round(s.dist))+' km':'—'}</b><span>${s.dist!=null?'à vol d’oiseau':'distance inconnue'}</span></div><button class="favb ${isFav?'on':''}" data-a="gasfav:${s.id}" aria-label="${isFav?'Retirer des favoris':'Ajouter aux favoris'}">${ic('star',20)}</button></div></div>
 <div class="nm">${esc(s.adresse||'Adresse non fournie')}</div><div class="ad">${esc(cv)}${s.pop==='A'?' · Autoroute':''}${s.h24?' · Automate 24h/24':''}</div><div class="m">${s.price?age(s.maj):''}${isFavList&&s.checkedAt?`<span>Relevé dans Minoa le ${new Date(s.checkedAt).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>`:''}</div>${g.length?`<div class="gap">${g.join(' · ')}</div>`:''}

async function geocode(q){const e=encodeURIComponent(q),urls=[`https://api-adresse.data.gouv.fr/search/?q=${e}&type=municipality&limit=1`,`https://data.geopf.fr/geocodage/search?q=${e}&type=municipality&limit=1`];let reached=false;
 for(const u of urls){try{const r=await fetchT(u,8000);if(!r.ok)continue;reached=true;const j=await r.json(),ft=j.features&&j.features[0];
  if(ft){const[lon,lat]=ft.geometry.coordinates,p=ft.properties||{};return {lat,lon,label:`${p.city||p.label||q}${p.postcode?' ('+p.postcode+')':''}`,mode:'place'}}}catch(err){}}
 return reached?'none':null}
async function placeSearch(q){q=String(q||'').trim();if(!q)return;G.q=q;G.status='geocoding';render();

 if(g&&g!=='none'){G.loc=g;return gasFetch()}
 if(g==='none'){G.status='geofail';return render()}
 G.loc=/^\d{5}$/.test(q)?{lat:null,lon:null,cp:q,label:'Code postal '+q,mode:'place'}:{lat:null,lon:null,label:q,mode:'place'};gasFetch()}
function locate(){if(!navigator.geolocation){G.status='nogeo';return render()}
 G.status='locating';render();
 navigator.geolocation.getCurrentPosition(p=>{G.loc={lat:p.coords.latitude,lon:p.coords.longitude,label:'Autour de moi',mode:'gps'};gasFetch()},
  e=>{G.status=e&&e.code===1?'denied':'nogeo';if(U.tab==='gas')render()},{enableHighAccuracy:false,timeout:12000,maximumAge:300000})}

function enterApp(){if(!U.splash)return;U.splash=false;U.tab='home';window.scrollTo(0,0);render()}
function initSwipe(){const btn=$('.start'),k=btn&&btn.querySelector('.go'),lab=btn&&btn.querySelector('span'),chev=btn&&btn.querySelector('.chev');if(!k)return;
 let x0=null,dx=0,max=0,moved=false,busy=false;
 const set=v=>{k.style.transform=`translateX(${v}px)`;const o=max?Math.max(0,1-v/(max*.7)):1;lab.style.opacity=o;chev.style.opacity=o;btn.style.setProperty('--fill',(v+56)+'px')};
 const finish=()=>{if(busy)return;busy=true;max=max||btn.clientWidth-k.offsetWidth-12;k.style.transition='transform .28s cubic-bezier(.2,.8,.2,1)';btn.style.transition='none';set(max);if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}setTimeout(enterApp,300)};
 k.addEventListener('pointerdown',e=>{if(busy)return;x0=e.clientX;dx=0;moved=false;max=btn.clientWidth-k.offsetWidth-12;k.style.transition='none';try{k.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()});
 k.addEventListener('pointermove',e=>{if(x0==null)return;dx=Math.max(0,Math.min(max,e.clientX-x0));if(dx>6)moved=true;set(dx)});
 const up=()=>{if(x0==null)return;x0=null;if(!moved||dx>max*.55)finish();else{k.style.transition='transform .35s cubic-bezier(.3,1.4,.5,1)';set(0)}};
 k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);
 btn.addEventListener('click',e=>{if(!k.contains(e.target))finish()});
 btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();finish()}})}
function render(){genRecur();const root=document.documentElement;root.classList.toggle('splash',!!U.splash);root.classList.toggle('pg-home',!U.splash&&U.tab==='home');if(!document.querySelector('.aur7'))document.body.insertAdjacentHTML('afterbegin','<div class="aur7" aria-hidden="true"><i></i><i></i><i></i></div>');
 if(U.splash){root.classList.remove('car');document.querySelector('meta[name=theme-color]').content='#0b1220';$('#app').innerHTML=splash();initSwipe();return}
 const v=V[U.tab](),isCar=U.tab==='car'||U.tab==='gas';
 root.classList.toggle("car",isCar);
 document.querySelector('meta[name=theme-color]').content=isCar?'#0e1622':(v.band!==undefined?'#0b1424':'#0e1622');
 const changed=U.tab!==window.__lastTab;window.__lastTab=U.tab;
 const hd=v.band!==undefined?v.band:`<header class="top"><div><div class="sub">${v.sub||''}</div><h1>${v.title}<span class="pt">.</span></h1></div>${v.head||''}</header>`;
 $('#app').innerHTML=`${hd}<main class="${v.band!==undefined?'wb':''}">${v.body}</main>${v.fab?`<button class="btn fab" data-a="${v.fab}" aria-label="Ajouter">${ic('plus',24)}</button>`:''}`;
 if(changed){root.classList.add('anim');clearTimeout(window.__animT);window.__animT=setTimeout(()=>root.classList.remove('anim'),1600);
  if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -4% 0px'});
   [...$('main').children].forEach(el=>{if(el.getBoundingClientRect().top>innerHeight*.92){el.classList.add('rv');io.observe(el)}});setTimeout(()=>document.querySelectorAll('.rv:not(.in)').forEach(e=>e.classList.add('in')),2600)}}

/* Réduit la photo (1400 px max, JPEG) pour ne pas saturer le stockage de l'appareil. */
function shrinkImg(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{try{const M=1400,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);ok(u.length<r.result.length?u:r.result)}catch(e){ok(r.result)}};im.src=r.result};r.readAsDataURL(file)})}

const STORE={db:'minoa',os:'kv',key:'state',ls:'minoa.state.v1',schema:1};
const P_={ready:false,mode:'idb',lastJSON:null,savedAt:null,saving:false,again:false,timer:null,err:'',persisted:null,firstRun:false};
const DEFAULTS=JSON.parse(JSON.stringify(S));
const GDEF={fuel:G.fuel,radius:G.radius};
function collect(){const d={};Object.keys(DEFAULTS).forEach(k=>d[k]=S[k]);d.gasPrefs={fuel:G.fuel,radius:G.radius};return d}
function applyData(d){
 if(!d||typeof d!=='object')throw new Error('format');
 Object.keys(DEFAULTS).forEach(k=>{const def=DEFAULTS[k],v=d[k];
  if(Array.isArray(def))S[k]=Array.isArray(v)?v:JSON.parse(JSON.stringify(def));
  else if(def&&typeof def==='object')S[k]=Object.assign(JSON.parse(JSON.stringify(def)),v&&typeof v==='object'&&!Array.isArray(v)?v:{});
  else S[k]=v??def});
 const g=d.gasPrefs||{};if(FUELS.some(x=>x[0]===g.fuel))G.fuel=g.fuel;else G.fuel=GDEF.fuel;
 G.radius=+g.radius>=1&&+g.radius<=30?+g.radius:GDEF.radius}
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open(STORE.db,1)}catch(e){return rej(e)}
 r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE.os))r.result.createObjectStore(STORE.os)};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB'));r.onblocked=()=>rej(new Error('IndexedDB bloqué'))})}
let _db=null;
async function idb(){if(!_db){_db=await idbOpen();_db.onversionchange=()=>{_db.close();_db=null}}return _db}
async function idbGet(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE.os,'readonly'),q=t.objectStore(STORE.os).get(STORE.key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function idbPut(rec){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE.os,'readwrite');t.objectStore(STORE.os).put(rec,STORE.key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error||new Error('écriture'));t.onabort=()=>rej(t.error||new Error('écriture annulée'))})}
function lsGet(){try{const v=localStorage.getItem(STORE.ls);return v?JSON.parse(v):null}catch(e){return null}}
function lsPut(rec){try{localStorage.setItem(STORE.ls,JSON.stringify(rec));return true}catch(e){return false}}
const fmtSaved=t=>t?new Date(t).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'jamais';
/* indicateur discret */
let _stT=null;
function saveStatus(state,msg){let el=document.getElementById('savest');
 if(!el){el=document.createElement('button');el.id='savest';el.type='button';el.addEventListener('click',()=>{if(el.classList.contains('err')){P_.lastJSON=null;flush()}});document.body.appendChild(el)}
 clearTimeout(_stT);el.className=state+' show';
 el.innerHTML=state==='saving'?'<span class="sdot"></span>Enregistrement…':state==='saved'?`${ic('tick',14)}Enregistré`:`${ic('info',14)}${msg||'Échec de l’enregistrement — touche pour réessayer'}`;
 if(state==='saved')_stT=setTimeout(()=>el.classList.remove('show'),1600)}
async function flush(){
 if(!P_.ready)return;
 const json=JSON.stringify(collect());if(json===P_.lastJSON)return;
 if(P_.saving){P_.again=true;return}
 P_.saving=true;saveStatus('saving');
 const rec={app:'Minoa',schema:STORE.schema,savedAt:Date.now(),json};
 const lsOk=lsPut(rec);let ok=false;
 if(P_.mode==='idb'){try{await idbPut(rec);ok=true}catch(e){P_.err=String(e&&e.message||e);ok=false}}
 else ok=lsOk;
 if(ok){P_.lastJSON=json;P_.savedAt=rec.savedAt;saveStatus('saved');if(U.tab==='settings'&&!document.querySelector('.sheet-bg'))refreshDataCard()}
 else{saveStatus('err');toast('Échec de l’enregistrement : tes dernières modifications ne sont pas sauvegardées')}
 P_.saving=false;if(P_.again){P_.again=false;flush()}}
function scheduleSave(){if(!P_.ready)return;clearTimeout(P_.timer);P_.timer=setTimeout(flush,250)}
['click','submit','input','change'].forEach(t=>document.addEventListener(t,scheduleSave));

async function boot(){
 let a=null,idbOk=true;
 try{a=await idbGet()}catch(e){idbOk=false;P_.err=String(e&&e.message||e)}
 const b=lsGet();
 if(!idbOk){let lsWorks=false;try{localStorage.setItem('minoa.test','1');localStorage.removeItem('minoa.test');lsWorks=true}catch(e){}
  if(!lsWorks){P_.mode='none';saveStatus('err','Stockage indisponible sur cet appareil : rien ne sera enregistré');return}
  P_.mode='ls'}
 const pick=[a,b].filter(r=>r&&r.json).sort((x,y)=>(y.savedAt||0)-(x.savedAt||0))[0];
 if(pick){try{applyData(JSON.parse(pick.json));P_.savedAt=pick.savedAt}catch(e){P_.mode='none';saveStatus('err','Sauvegarde illisible : rien n’a été écrasé. Exporte-la depuis Réglages si possible.');return}}
 else P_.firstRun=true;
 P_.lastJSON=pick?JSON.stringify(collect()):null;
 P_.ready=true;
 if(!U.splash)render();
 if(P_.firstRun||(pick&&pick===b&&P_.mode==='idb'))flush();
 try{if(navigator.storage&&navigator.storage.persist){P_.persisted=await navigator.storage.persisted();if(!P_.persisted)P_.persisted=await navigator.storage.persist()}}catch(e){}
 if(U.tab==='settings'&&!U.splash)render()}

function dataCounts(d){const n=k=>Array.isArray(d[k])?d[k].length:0;return [['tâches',n('tasks')],['rendez-vous',n('events')],['opérations',n('money')],['articles de courses',n('shop')],['repas planifiés',Object.keys(d.plan||{}).length],['recettes',n('mealIdeas')],['projets',n('ideas')],['réalisations',n('portfolio')],['pleins',n('fuel')],['frais voiture',n('carCosts')],['rappels voiture',n('carDue')],['entrées du carnet',n('journal')],['stations favorites',n('gasFav')]].filter(x=>x[1])}
function dataCardHTML(){const where=P_.mode==='idb'?'Base de données locale de ce navigateur (IndexedDB), avec une copie de secours':P_.mode==='ls'?'Stockage local de ce navigateur (localStorage)':'Aucun stockage disponible';
 const per=P_.persisted===true?'Stockage persistant accordé par le navigateur':P_.persisted===false?'Stockage persistant non accordé : le navigateur peut effacer les données s’il manque de place':'Conservation persistante : information non disponible';
 return `<h3>Mes données</h3><div class="mdrow"><span>Dernière sauvegarde</span><b id="lastsave">${P_.mode==='none'?'—':fmtSaved(P_.savedAt)}</b></div><div class="mdrow"><span>Emplacement</span><b>${where}</b></div><div class="mdrow"><span>Conservation</span><b>${per}</b></div>${P_.mode==='none'?'<p style="color:#ef8a7a">L’enregistrement est impossible ici. Exporte régulièrement tes données.</p>':''}
 <button class="btn block" data-a="export">${ic('down',18)}Exporter mes données</button><button class="btn ghost block" data-a="import">${ic('up',18)}Importer une sauvegarde</button><input type="file" id="importf" accept="application/json,.json" hidden></div>`}

async function exportData(){await flush();
 const payload={app:'Minoa',schema:STORE.schema,exportedAt:new Date().toISOString(),data:collect()};
 const txt=JSON.stringify(payload,null,1),name=`minoa-sauvegarde-${iso(new Date())}.json`;
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
 if(dl){try{await dl.save({filename:name,data:new Blob([txt],{type:'application/json'})});toast('Sauvegarde exportée');return}catch(e){if(e&&e.code==='declined'){toast('Export annulé');return}}}
 try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sauvegarde exportée')}

let _pendingImport=null;
function readImport(file){if(!file)return;const r=new FileReader();
 r.onload=()=>{let p;try{p=JSON.parse(r.result)}catch(e){return toast('Fichier illisible : ce n’est pas une sauvegarde Minoa')}
  const d=p&&p.app==='Minoa'&&p.data&&typeof p.data==='object'?p.data:null;if(!d)return toast('Ce fichier n’est pas une sauvegarde Minoa');
  _pendingImport=d;const c=dataCounts(d);
  sheet(`<h3>Restaurer cette sauvegarde ?${closeBtn}</h3><p class="cfm">Sauvegarde du <b>${p.exportedAt?new Date(p.exportedAt).toLocaleString('fr-FR'):'(date inconnue)'}</b>.</p><p class="cfm">${c.length?'Elle contient : '+c.map(([l,n])=>`${n} ${l}`).join(', ')+'.':'Elle ne contient aucun élément.'}</p><p class="cfm warnp">${ic('info',16)}<span>Toutes tes données actuelles seront <b>remplacées</b>. Exporte-les d’abord si tu veux les garder.</span></p><div class="actions"><button type="button" class="btn ghost" data-a="close">Annuler</button><button type="button" class="btn" data-a="importok">Remplacer mes données</button></div>`)};
 r.onerror=()=>toast('Impossible de lire ce fichier');r.readAsText(file)}
async function confirmImport(){const d=_pendingImport;_pendingImport=null;if(!d)return;
 const before=JSON.stringify(collect());
 try{applyData(d)}catch(e){applyData(JSON.parse(before));return toast('Import impossible : fichier incomplet')}
 closeSheet();P_.lastJSON=null;render();await flush();toast(P_.lastJSON?'Sauvegarde restaurée':'Restaurée, mais l’enregistrement a échoué')}
function confirmWipe(){const c=dataCounts(collect());
 sheet(`<h3>Effacer toutes les données ?${closeBtn}</h3><p class="cfm">${c.length?'Seront supprimés : '+c.map(([l,n])=>`${n} ${l}`).join(', ')+', ainsi que la fiche du véhicule et tes préférences.':'Tes préférences et la fiche du véhicule seront remises à zéro.'}</p><p class="cfm warnp">${ic('info',16)}<span>Cette action est <b>définitive</b>. Exporte tes données avant si tu veux pouvoir les restaurer.</span></p><div class="actions"><button type="button" class="btn ghost" data-a="close">Annuler</button><button type="button" class="btn danger" data-a="wipeok">Tout effacer</button></div><button type="button" class="link" data-a="export" style="width:100%;margin-top:8px">Exporter d’abord mes données</button>`)}
document.addEventListener('change',e=>{if(e.target.id==='importf'){readImport(e.target.files[0]);e.target.value=''}});

render();boot();
</script>
<script>
/* Minoa PWA : active le fonctionnement hors connexion (uniquement sur une adresse https, par ex. Netlify) */
(function(){
 var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 if(standalone)document.documentElement.classList.add('pwa');
 var okHost=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
 if('serviceWorker' in navigator&&okHost){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.warn('Service worker non enregistré',e)})})}
})();
</script>
